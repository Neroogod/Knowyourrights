[project]
name = "knowyourrights"
version = "0.1.0"
description = "KnowYourRights - a trustworthy, offline-first Nigerian legal-rights app (MVP)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]

[tool.coverage.run]
source = ["backend"]
omit = ["backend/tests/*", "*/__main__.py"]

[tool.coverage.report]
# The trust-critical modules must stay well-covered; this is a floor, not a target.
fail_under = 70
show_missing = true

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["app", ".venv", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
