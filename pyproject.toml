[project]
name = "knowyourrights"
version = "0.1.0"
description = "KnowYourRights - a trustworthy, offline-first Nigerian legal-rights app (MVP)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["app", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
