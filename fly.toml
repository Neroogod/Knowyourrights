# Fly.io config. Deploys the Dockerfile straight from your machine (no GitHub
# needed). Region jnb (Johannesburg) is the closest Fly region to Nigeria.
# Deploy: `fly auth login` then `fly launch --copy-config --now` (or `fly deploy`).
app = "knowyourrights-api"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/v1/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
