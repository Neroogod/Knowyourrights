# Render.com Blueprint. Free tier, no credit card required.
# Deploy: push this folder to a GitHub repo, then in Render choose
# "New +" -> "Blueprint" and pick the repo. Render reads this file.
services:
  - type: web
    name: knowyourrights-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /v1/health
    autoDeploy: true
