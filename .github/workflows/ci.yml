name: CI

# The quality gates every change must clear before it can ship. The AI trust
# gate (ai-trust-gate.yml) runs the RAG regression separately on content changes;
# this pipeline covers lint, types, tests+coverage, a security scan, the pipeline
# self-tests, the migration gate, and the Flutter app.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, types, tests, security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy backend || true   # advisory until the type surface is annotated

      - name: Pipeline self-tests (runnable __main__)
        run: |
          python content_pipeline/sources.py
          python content_pipeline/sectioniser.py
          python content_pipeline/chunker.py
          python content_pipeline/pdf_extract.py
          python backend/schemas.py
          python backend/observability.py

      - name: Tests with coverage gate
        run: pytest -q --cov --cov-report=term-missing

      - name: Security & dependency scan
        run: pip-audit --strict --ignore-vuln PYSEC-0000-0000 || pip-audit

  ai-trust-gate:
    name: AI trust gate (RAG regression)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: RAG accuracy / citation / refusal gate
        run: python -m backend.rag.evaluate --write-report ai-evaluation-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-evaluation-report
          path: ai-evaluation-report.json

  migrations:
    name: Migration gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Migrations apply and reverse cleanly
        run: |
          export DATABASE_URL="sqlite+pysqlite:////tmp/ci_migrations.db"
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: A single migration head (no unmerged branches)
        run: |
          heads=$(alembic heads | grep -c '(head)')
          test "$heads" = "1" || { echo "expected exactly one migration head, found $heads"; exit 1; }

  flutter:
    name: Flutter — analyze & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
